<div class="m-grid m-grid--hor m-grid--root m-page">
    <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-grid--tablet-and-mobile m-grid--hor-tablet-and-mobile m-login m-login--1 m-login--signin" id="m_login">
        <div class="m-grid__item m-grid__item--order-tablet-and-mobile-2 m-login__aside">
            <div class="m-stack m-stack--hor m-stack--desktop">
                <div class="m-stack__item m-stack__item--fluid">
                    <div class="m-login__wrapper">
                        <div class="m-login__logo">
                            <a href="#inicio">
                                <img src="./src/img/logo-gimnasio.jpg" alt="Logo Gimnasio" style="max-height: 250px;">
                            </a>
                        </div>
                        <div class="m-login__signin">
                            <div class="m-login__head">
                                <h3 class="m-login__title">
                                    Ingreso de los usuarios activos en la plataforma
                                </h3>
                            </div>
                            <form class="m-login__form m-form" action="">
                                <div class="form-group m-form__group">
                                    <input class="form-control m-input" type="text" placeholder="Email" name="email" autocomplete="off">
                                </div>
                                <div class="form-group m-form__group">
                                    <input class="form-control m-input m-login__form-input--last" type="password" placeholder="contraseña" name="password">
                                </div>
                                <div class="row m-login__form-sub">
                                    <div class="col m--align-left">
                                        <label class="m-checkbox m-checkbox--success">
                                            <input type="checkbox" name="remember">
                                            Recordarme
                                            <span></span>
                                        </label>
                                    </div>
                                    <div class="col m--align-right">
                                        <!-- Enlace actualizado para ir al apartado de recuperar contraseña -->
                                        <a href="#olvide" id="m_login_forget_password" class="m-link">
                                            Olvide mi clave
                                        </a>
                                    </div>
                                </div>
                                <div class="m-login__form-action">
                                    <button id="m_login_signin_submit" class="btn btn-success m-btn m-btn--pill m-btn--custom m-btn--air">
                                        Ingresar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="m-stack__item m-stack__item--center">
                    <div class="m-login__account">
                        <span class="m-login__account-msg">
                            No tienes una cuenta todavía?
                        </span>
                        &nbsp;&nbsp;
                        <!-- Enlace actualizado para ir al apartado de registro/alta -->
                        <a href="#alta" id="m_login_signup" class="m-link m-link--success m-login__account-link">
                            Crear cuenta
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="m-grid__item m-grid__item--fluid m-grid m-grid--center m-grid--hor m-grid__item--order-tablet-and-mobile-1  m-login__content" style="background-image: url(./src/img/bg-5.jpg)">
            <div class="m-grid__item m-grid__item--middle">
                <h3 class="m-login__welcome">
                    Todo tu gimnasio, conectado.
                </h3>
                <p class="m-login__msg">
                    Un solo lugar para gestionar tu actividad,
                    <br>
                    consultar información y estar al día.
                </p>
            </div>
        </div>
    </div>
</div>
