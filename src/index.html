<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Rapiboy</title>
    
    <!-- Estilos de la plantilla -->
    <link href="./shared/template/css/vendors.bundle.css" rel="stylesheet" type="text/css" />
    <link href="./shared/template/css/style.bundle.css" rel="stylesheet" type="text/css" />
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; overflow: hidden;">

    <!-- Contenedor Principal en Pantalla Completa (Lado a Lado) -->
    <div style="display: flex; width: 100vw; height: 100vh;">
        
        <!-- LADO IZQUIERDO: Formulario de Login -->
        <div style="flex: 1; background-color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box;">
            <div style="width: 100%; max-width: 400px;">
                
                <!-- Logo -->
                <div style="margin-bottom: 2rem;">
                    <svg width="45" height="40" viewBox="0 0 45 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 40H10L22.5 15L35 40H45L27.5 0H17.5L0 40Z" fill="#6c5ce7"/>
                    </svg>
                </div>
                
                <!-- Título -->
                <div style="margin-bottom: 2rem;">
                    <h2 style="font-weight: 700; color: #111; font-size: 1.8rem; margin: 0;">Sign In To Admin</h2>
                </div>
                
                <!-- Formulario -->
                <form action="/login" method="POST">
                    <div style="margin-bottom: 1.2rem;">
                        <input type="email" placeholder="Email" name="email" autocomplete="off" required style="width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none;">
                    </div>
                    <div style="margin-bottom: 1.2rem;">
                        <input type="password" placeholder="Password" name="password" required style="width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none;">
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 1.5rem; color: #666;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" name="remember" style="accent-color: #6c5ce7;"> Remember me
                        </label>
                        <a href="javascript:;" style="color: #6c5ce7; text-decoration: none;">Forget Password ?</a>
                    </div>
                    
                    <div>
                        <button type="submit" style="width: 100%; padding: 14px; background-color: #6c5ce7; border: none; border-radius: 30px; font-weight: bold; color: white; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);">Sign In</button>
                    </div>
                </form>
                
                <!-- Registro -->
                <div style="text-align: center; font-size: 14px; margin-top: 2rem; color: #666;">
                    Don't have an account yet? <a href="register.html" style="color: #6c5ce7; text-decoration: none; font-weight: bold;">Sign Up</a>
                </div>

            </div>
        </div>
        
        <!-- LADO DERECHO: Banner con fondo morado e imagen -->
        <div style="flex: 1; background-color: #5c35b1; background-image: url('./shared/template/media/img/bg/bg-1.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; padding: 3rem; box-sizing: border-box;">
            <div style="max-width: 450px; color: white;">
                <h1 style="font-size: 3rem; font-weight: bold; margin-bottom: 1rem; line-height: 1.2;">Join Our Community</h1>
                <p style="font-size: 1.1rem; opacity: 0.85; line-height: 1.6; margin: 0;">
                </p>
            </div>
        </div>

    </div>

</body>
</html>
